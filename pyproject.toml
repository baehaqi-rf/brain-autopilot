[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-autopilot"
version = "3.0.0"
description = "Continually learning real-time autonomous verification, exploration, and playtesting engine for Web Apps (Next.js/React/Astro), Mobile Apps (Expo/React Native/Flutter/ADB), and 3D/WebGL Apps."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Baehaqi RF" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "automation", "testing", "qa", "cdp", "adb", "webgl", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/baehaqi-rf/brain-autopilot"
Repository = "https://github.com/baehaqi-rf/brain-autopilot"
Issues = "https://github.com/baehaqi-rf/brain-autopilot/issues"
Changelog = "https://github.com/baehaqi-rf/brain-autopilot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
brain-autopilot = "brain_autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["brain_autopilot*"]
namespaces = false

[tool.setuptools.package-data]
brain_autopilot = ["workflows/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
